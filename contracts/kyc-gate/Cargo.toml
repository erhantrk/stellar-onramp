[package]
name = "kyc-gate"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"          # soroban-sdk 27.0.6 MSRV
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Test-only: the gate calls the registry across the ABI boundary (`RegistryClient`), it does not
# link against it. The tests deploy a real registry and register the frozen issuer key.
kyc-registry = { path = "../kyc-registry" }
